name: taxi_rider_app
description: Passenger rideshare client — Clean Architecture, Firebase, Google Maps.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_database: ^11.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  fluttertoast: ^8.2.8
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  http: ^1.2.2
  flutter_polyline_points: ^2.1.0
  font_awesome_flutter: ^10.7.0
  animated_text_kit: ^4.2.2
  flutter_geofire: ^2.0.1
  url_launcher: ^6.3.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - sounds/
  fonts:
    - family: Bolt
      fonts:
        - asset: fonts/bolt-regular.ttf
        - asset: fonts/bolt-semibold.ttf
          weight: 900
    - family: Signatra
      fonts:
        - asset: fonts/Signatra.ttf
